<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sliding In — Single Deck Links</title>
<style>
body{font-family:system-ui,sans-serif;background:#08090a;color:#f7f8f8;padding:24px;max-width:900px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:8px}
p{color:#8a8f98;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
a.card{display:block;padding:12px 14px;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none;color:#f7f8f8;background:rgba(255,255,255,.02);transition:all .15s}
a.card:hover{border-color:#5e6ad2;background:rgba(94,106,210,.08)}
.title{font-weight:600;font-size:.95rem;margin-bottom:2px}
.slug{font-family:monospace;font-size:.7rem;color:#8a8f98}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:999;background:#08090a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <h2 style="margin:0">Private Access</h2>
  <input id="gatePw" type="password" placeholder="Password" style="padding:10px;border-radius:6px;border:1px solid #333;background:#111;color:#fff;font-size:1rem">
  <button onclick="unlock()" style="padding:10px 20px;border-radius:6px;background:#5e6ad2;color:#fff;border:none;cursor:pointer;font-weight:600">Enter</button>
  <div id="gateErr" style="color:#f87171;font-size:.85rem"></div>
</div>
<script>
var GATE_HASH='69e151c82f097246eb188e3d75dac1d725fbfaa82df179adff60d857ec97a03b';
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function unlock(){
  var pw=document.getElementById('gatePw').value;
  var h=await sha256(pw);
  if(h===GATE_HASH){sessionStorage.setItem('si_unlocked','1');document.getElementById('gate').style.display='none';}
  else{document.getElementById('gateErr').textContent='Wrong password';}
}
if(sessionStorage.getItem('si_unlocked')==='1'){document.addEventListener('DOMContentLoaded',function(){var g=document.getElementById('gate');if(g)g.style.display='none';});}
</script>
<h1>Sliding In — Single Deck Links</h1>
<p>Click a deck to open it directly. Share the URL with students.</p>
<div class="grid" id="grid"></div>
<script>
var base='https://articulate-english.github.io/sliding-in-pwa/?deck=';
var decks=[
["airportsflying","Airports and Flying"],
["carsdriving","Cars and Driving"],
["conversation","Conversation"],
["cellphones","Cell Phones"],
["socialnetworksmessaging","Social Networks and Messaging"],
["introductions","Introductions"],
["doyoulike","Do You Like...?"],
["doyouprefer","Do You Prefer...?"],
["advice","Advice"],
["truthhonesty","Truth and Honesty"],
["okornotok","OK or Not OK?"],
["risksdanger","Risks and Danger"],
["whatwouldyoudo","What Would You Do...?"],
["wouldyouever","Would You Ever...?"],
["haveyouever","Have You Ever...?"],
["whatsthebestage","What's The Best Age To...?"],
["whatsthebestway","What's The Best Way To...?"],
["whattime","What Time...?"],
["howmany","How Many...?"],
["howoften","How Often Do You...?"],
["howspecialisit","How Special Is It...?"],
["where","Where...?"],
["who","Who...?"],
["whodoyouusuallygoto","Who Do You Usually Go To...?"],
["advantagesdisadvantages","Advantages and Disadvantages"],
["annoyingthings","Annoying Things"]
];
var g=document.getElementById('grid');
decks.forEach(function(d){
  var a=document.createElement('a');
  a.className='card';
  a.href=base+d[0];
  a.target='_blank';
  a.innerHTML='<div class="title">'+d[1]+'</div><div class="slug">'+d[0]+'</div>';
  g.appendChild(a);
});
</script>
</body>
</html>
